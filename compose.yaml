# PostgreSQL для примеров курса. Порт, пользователь и пароль совпадают
# с адресом базы в уроках.
services:
  db:
    image: postgres:18
    container_name: drizzle-course-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drizzle_course
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "drizzle_course"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
